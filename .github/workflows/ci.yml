name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && GOOS=linux go vet ./...
      - name: test
        run: go test -race ./...
      - name: container tests
        # -race needs cgo, which makes the test binary dynamic; these tests
        # run it inside a bare image, so build it static.
        if: runner.os == 'Linux'
        run: CGO_ENABLED=0 go test -v -run 'TestRun' ./internal/container/
      - name: build
        run: make && ./aic version
