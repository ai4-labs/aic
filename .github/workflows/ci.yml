name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && GOOS=linux go vet ./...
      - name: test
        run: go test -race ./...
      - name: container tests (verbose)
        if: runner.os == 'Linux'
        run: go test -v -run 'TestRun' ./internal/container/ && grep -E '^/proc|proc ' /proc/self/mountinfo | head -20
      - name: build
        run: make && ./aic version
